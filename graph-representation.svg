<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Graph representation with adjacency and incidence matrices</title>
  <desc id="desc">A sample undirected graph with four vertices alongside its adjacency matrix and incidence matrix.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .panel-title { font: 700 24px "Segoe UI", sans-serif; fill: #0f172a; }
    .note { font: 500 16px "Segoe UI", sans-serif; fill: #475569; }
    .vertex { fill: #14b8a6; stroke: #0f766e; stroke-width: 3; }
    .vertex-label { font: 700 18px "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #334155; stroke-width: 6; stroke-linecap: round; }
    .edge-label { font: 600 16px "Segoe UI", sans-serif; fill: #b45309; }
    .matrix-head { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
    .matrix-side { fill: #ecfeff; stroke: #99f6e4; stroke-width: 1.5; }
    .matrix-cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .matrix-text { font: 600 18px "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    .matrix-label { font: 700 18px "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <rect x="20" y="20" width="1240" height="480" rx="26" fill="#f8fafc"/>

  <rect class="panel" x="44" y="54" width="340" height="410" rx="20"/>
  <text class="panel-title" x="214" y="96" text-anchor="middle">Sample Graph G</text>
  <text class="note" x="214" y="124" text-anchor="middle">Edges: e1=(v1,v2), e2=(v1,v3), e3=(v2,v3), e4=(v3,v4)</text>

  <line class="edge" x1="170" y1="170" x2="110" y2="285"/>
  <line class="edge" x1="170" y1="170" x2="280" y2="285"/>
  <line class="edge" x1="110" y1="285" x2="280" y2="285"/>
  <line class="edge" x1="280" y1="285" x2="220" y2="390"/>

  <text class="edge-label" x="124" y="220">e1</text>
  <text class="edge-label" x="236" y="218">e2</text>
  <text class="edge-label" x="190" y="268">e3</text>
  <text class="edge-label" x="262" y="350">e4</text>

  <circle class="vertex" cx="170" cy="170" r="24"/>
  <circle class="vertex" cx="110" cy="285" r="24"/>
  <circle class="vertex" cx="280" cy="285" r="24"/>
  <circle class="vertex" cx="220" cy="390" r="24"/>

  <text class="vertex-label" x="170" y="170">v1</text>
  <text class="vertex-label" x="110" y="285">v2</text>
  <text class="vertex-label" x="280" y="285">v3</text>
  <text class="vertex-label" x="220" y="390">v4</text>

  <rect class="panel" x="420" y="54" width="360" height="410" rx="20"/>
  <text class="panel-title" x="600" y="96" text-anchor="middle">Adjacency Matrix A</text>
  <text class="note" x="600" y="124" text-anchor="middle">Aij = 1 if vi is adjacent to vj, else 0</text>

  <g transform="translate(472 160)">
    <rect class="matrix-head" x="60" y="0" width="60" height="50"/>
    <rect class="matrix-head" x="120" y="0" width="60" height="50"/>
    <rect class="matrix-head" x="180" y="0" width="60" height="50"/>
    <rect class="matrix-head" x="240" y="0" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="50" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="100" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="150" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="200" width="60" height="50"/>

    <text class="matrix-label" x="90" y="25">v1</text>
    <text class="matrix-label" x="150" y="25">v2</text>
    <text class="matrix-label" x="210" y="25">v3</text>
    <text class="matrix-label" x="270" y="25">v4</text>
    <text class="matrix-label" x="30" y="75">v1</text>
    <text class="matrix-label" x="30" y="125">v2</text>
    <text class="matrix-label" x="30" y="175">v3</text>
    <text class="matrix-label" x="30" y="225">v4</text>

    <rect class="matrix-cell" x="60" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="60" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="60" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="60" y="200" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="200" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="200" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="200" width="60" height="50"/>

    <text class="matrix-text" x="90" y="75">0</text>
    <text class="matrix-text" x="150" y="75">1</text>
    <text class="matrix-text" x="210" y="75">1</text>
    <text class="matrix-text" x="270" y="75">0</text>
    <text class="matrix-text" x="90" y="125">1</text>
    <text class="matrix-text" x="150" y="125">0</text>
    <text class="matrix-text" x="210" y="125">1</text>
    <text class="matrix-text" x="270" y="125">0</text>
    <text class="matrix-text" x="90" y="175">1</text>
    <text class="matrix-text" x="150" y="175">1</text>
    <text class="matrix-text" x="210" y="175">0</text>
    <text class="matrix-text" x="270" y="175">1</text>
    <text class="matrix-text" x="90" y="225">0</text>
    <text class="matrix-text" x="150" y="225">0</text>
    <text class="matrix-text" x="210" y="225">1</text>
    <text class="matrix-text" x="270" y="225">0</text>
  </g>

  <rect class="panel" x="816" y="54" width="400" height="410" rx="20"/>
  <text class="panel-title" x="1016" y="96" text-anchor="middle">Incidence Matrix B</text>
  <text class="note" x="1016" y="124" text-anchor="middle">Bve = 1 if vertex v is incident on edge e, else 0</text>

  <g transform="translate(860 160)">
    <rect class="matrix-head" x="60" y="0" width="60" height="50"/>
    <rect class="matrix-head" x="120" y="0" width="60" height="50"/>
    <rect class="matrix-head" x="180" y="0" width="60" height="50"/>
    <rect class="matrix-head" x="240" y="0" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="50" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="100" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="150" width="60" height="50"/>
    <rect class="matrix-side" x="0" y="200" width="60" height="50"/>

    <text class="matrix-label" x="90" y="25">e1</text>
    <text class="matrix-label" x="150" y="25">e2</text>
    <text class="matrix-label" x="210" y="25">e3</text>
    <text class="matrix-label" x="270" y="25">e4</text>
    <text class="matrix-label" x="30" y="75">v1</text>
    <text class="matrix-label" x="30" y="125">v2</text>
    <text class="matrix-label" x="30" y="175">v3</text>
    <text class="matrix-label" x="30" y="225">v4</text>

    <rect class="matrix-cell" x="60" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="50" width="60" height="50"/>
    <rect class="matrix-cell" x="60" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="100" width="60" height="50"/>
    <rect class="matrix-cell" x="60" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="150" width="60" height="50"/>
    <rect class="matrix-cell" x="60" y="200" width="60" height="50"/>
    <rect class="matrix-cell" x="120" y="200" width="60" height="50"/>
    <rect class="matrix-cell" x="180" y="200" width="60" height="50"/>
    <rect class="matrix-cell" x="240" y="200" width="60" height="50"/>

    <text class="matrix-text" x="90" y="75">1</text>
    <text class="matrix-text" x="150" y="75">1</text>
    <text class="matrix-text" x="210" y="75">0</text>
    <text class="matrix-text" x="270" y="75">0</text>
    <text class="matrix-text" x="90" y="125">1</text>
    <text class="matrix-text" x="150" y="125">0</text>
    <text class="matrix-text" x="210" y="125">1</text>
    <text class="matrix-text" x="270" y="125">0</text>
    <text class="matrix-text" x="90" y="175">0</text>
    <text class="matrix-text" x="150" y="175">1</text>
    <text class="matrix-text" x="210" y="175">1</text>
    <text class="matrix-text" x="270" y="175">1</text>
    <text class="matrix-text" x="90" y="225">0</text>
    <text class="matrix-text" x="150" y="225">0</text>
    <text class="matrix-text" x="210" y="225">0</text>
    <text class="matrix-text" x="270" y="225">1</text>
  </g>
</svg>
